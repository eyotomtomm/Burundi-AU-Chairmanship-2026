# DigitalOcean App Platform Specification
# Deploy: doctl apps create --spec .do/app.yaml
# Update: doctl apps update <app-id> --spec .do/app.yaml
#
# Before deploying, set encrypted env vars in DO dashboard:
#   DJANGO_SECRET_KEY, DATABASE_URL, EMAIL_HOST_PASSWORD,
#   SENTRY_DSN, etc.

name: burundi-au-chairmanship

region: fra  # Frankfurt — closest to Africa

services:
  - name: api
    github:
      repo: eyotomtomm/Burundi-AU-Chairmanship-2026
      branch: main
      deploy_on_push: false
    source_dir: /burundi_au_chairmanship/backend
    environment_slug: python
    instance_count: 1
    instance_size_slug: professional-xs  # $12/mo, 1 vCPU, 1GB RAM
    http_port: 8080
    # ASGI via gunicorn + uvicorn workers — serves both HTTP and WebSocket.
    # Migrate and collectstatic run once in the pre-deploy job below.
    run_command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -c gunicorn.conf.py
    # /api/health/ returns {"status":"ok"} for anonymous callers — it proves the
    # ASGI worker is up and routing, not that Postgres/Redis are reachable
    # (component checks are staff-only). DB/cache failures surface via Sentry.
    health_check:
      http_path: /api/health/
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 5
    envs:
      # Non-sensitive (can be set here)
      - key: SKIP_ENTRYPOINT_MIGRATE
        value: "1"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "api.burundi4africa.com,burundi4africa.com,www.burundi4africa.com,burundi-au-api-mgo34.ondigitalocean.app"
      - key: SITE_URL
        value: "https://burundi4africa.com"
      # OTP and system mail send from the chairmanship domain, whose SMTP is
      # SPF/DKIM-aligned for that From address. Gmail is the fallback below.
      # Writes an EmailLog row for every message so the admin's Email Logs page
      # has something in it, and carries the SMTP fallback for all mail rather
      # than OTP alone. Honours fail_silently, so failures still surface.
      - key: EMAIL_BACKEND
        value: "core.email_backend.LoggingEmailBackend"
      - key: EMAIL_HOST
        value: "smtp.burundichairship.africa"
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_TLS
        value: "False"
      - key: EMAIL_USE_SSL
        value: "True"
      - key: EMAIL_HOST_USER
        value: "info@burundichairship.africa"
      - key: DEFAULT_FROM_EMAIL
        value: "Be 4 Africa <info@burundichairship.africa>"
      # Fallback, used only when the primary host refuses the connection.
      - key: FALLBACK_EMAIL_HOST
        value: "smtp.gmail.com"
      - key: FALLBACK_EMAIL_PORT
        value: "587"
      - key: FALLBACK_EMAIL_USE_TLS
        value: "True"
      - key: FALLBACK_EMAIL_USE_SSL
        value: "False"
      - key: FALLBACK_EMAIL_HOST_USER
        value: "info@burundi4africa.com"
      - key: FALLBACK_FROM_EMAIL
        value: "Be 4 Africa <info@burundi4africa.com>"
      - key: SENTRY_ENVIRONMENT
        value: "production"
      # ${_self.COMMIT_HASH} is the git SHA App Platform built this component from.
      - key: SENTRY_RELEASE
        value: "burundi-au-backend@${_self.COMMIT_HASH}"
      # Play App Signing certificate SHA-256 (comma-separated if several). Set in
      # the dashboard so App Links verify for the Play-signed build. See config/urls.py.
      - key: ANDROID_PLAY_SIGNING_SHA256
        value: ""
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
      # Sensitive — set as ENCRYPTED in DigitalOcean dashboard
      - key: DJANGO_SECRET_KEY
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DATABASE_URL
        type: SECRET
        value: "${db.DATABASE_URL}"
      - key: REDIS_URL
        type: SECRET
        value: "${redis.DATABASE_URL}"
      # Read replica — optional, set in dashboard after creating replica via doctl
      - key: READ_REPLICA_URL
        type: SECRET
        value: ""
      - key: EMAIL_HOST_PASSWORD
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      # The Gmail app password, now used only by the fallback path.
      - key: FALLBACK_EMAIL_HOST_PASSWORD
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: SENTRY_DSN
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: SENTRY_AUTH_TOKEN
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: SENTRY_ORG
        value: "burundi-embassy-pu"
      - key: SENTRY_PROJECT
        value: "b4africa-backend"
      - key: FIREBASE_CREDENTIALS_JSON
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DO_SPACES_KEY
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DO_SPACES_SECRET
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: GEMINI_API_KEY
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: CAMPAIGN_EMAIL_HOST_PASSWORD
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DO_SPACES_BUCKET
        value: "burundi-au-media"
      - key: DO_SPACES_ENDPOINT
        value: "https://fra1.digitaloceanspaces.com"
      # Serve media from the Spaces CDN edge instead of the fra1 origin.
      # Enable the CDN on the Space first (Spaces → burundi-au-media → Settings
      # → CDN). Included in the $5/mo Spaces plan; no extra charge.
      - key: CDN_DOMAIN
        value: "burundi-au-media.fra1.cdn.digitaloceanspaces.com"


# Celery worker — processes async push notifications, OTP cleanup, etc.
# Defined under "workers" (not "services") so App Platform treats it as a
# background process: no HTTP routing, no HTTP health checks.
workers:
  - name: celery-worker
    github:
      repo: eyotomtomm/Burundi-AU-Chairmanship-2026
      branch: main
      deploy_on_push: false
    source_dir: /burundi_au_chairmanship/backend
    environment_slug: python
    instance_count: 1
    instance_size_slug: professional-xs
    run_command: celery -A config worker -B -l info --concurrency=2
    envs:
      - key: DJANGO_DEBUG
        value: "False"
      # Mirrors the api service: tasks send email and build absolute media URLs.
      - key: SITE_URL
        value: "https://burundi4africa.com"
      # OTP and system mail send from the chairmanship domain, whose SMTP is
      # SPF/DKIM-aligned for that From address. Gmail is the fallback below.
      # Writes an EmailLog row for every message so the admin's Email Logs page
      # has something in it, and carries the SMTP fallback for all mail rather
      # than OTP alone. Honours fail_silently, so failures still surface.
      - key: EMAIL_BACKEND
        value: "core.email_backend.LoggingEmailBackend"
      - key: EMAIL_HOST
        value: "smtp.burundichairship.africa"
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_TLS
        value: "False"
      - key: EMAIL_USE_SSL
        value: "True"
      - key: EMAIL_HOST_USER
        value: "info@burundichairship.africa"
      - key: DEFAULT_FROM_EMAIL
        value: "Be 4 Africa <info@burundichairship.africa>"
      # Fallback, used only when the primary host refuses the connection.
      - key: FALLBACK_EMAIL_HOST
        value: "smtp.gmail.com"
      - key: FALLBACK_EMAIL_PORT
        value: "587"
      - key: FALLBACK_EMAIL_USE_TLS
        value: "True"
      - key: FALLBACK_EMAIL_USE_SSL
        value: "False"
      - key: FALLBACK_EMAIL_HOST_USER
        value: "info@burundi4africa.com"
      - key: FALLBACK_FROM_EMAIL
        value: "Be 4 Africa <info@burundi4africa.com>"
      - key: CDN_DOMAIN
        value: "burundi-au-media.fra1.cdn.digitaloceanspaces.com"
      - key: SENTRY_RELEASE
        value: "burundi-au-backend@${_self.COMMIT_HASH}"
      - key: DJANGO_ALLOWED_HOSTS
        value: "api.burundi4africa.com,burundi4africa.com,www.burundi4africa.com,burundi-au-api-mgo34.ondigitalocean.app"
      - key: DJANGO_SECRET_KEY
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DATABASE_URL
        type: SECRET
        value: "${db.DATABASE_URL}"
      - key: REDIS_URL
        type: SECRET
        value: "${redis.DATABASE_URL}"
      - key: READ_REPLICA_URL
        type: SECRET
        value: ""
      - key: FIREBASE_CREDENTIALS_JSON
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DO_SPACES_KEY
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DO_SPACES_SECRET
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DO_SPACES_BUCKET
        value: "burundi-au-media"
      - key: DO_SPACES_ENDPOINT
        value: "https://fra1.digitaloceanspaces.com"
      - key: CAMPAIGN_EMAIL_HOST_PASSWORD
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: EMAIL_HOST_PASSWORD
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      # The Gmail app password, now used only by the fallback path.
      - key: FALLBACK_EMAIL_HOST_PASSWORD
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: SENTRY_DSN
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: SENTRY_ENVIRONMENT
        value: "production"

# Pre-deploy job — runs ONCE per deploy, before any web container starts.
# This prevents migration races when instance_count > 1.
jobs:
  - name: pre-deploy
    kind: PRE_DEPLOY
    github:
      repo: eyotomtomm/Burundi-AU-Chairmanship-2026
      branch: main
    source_dir: /burundi_au_chairmanship/backend
    environment_slug: python
    instance_size_slug: professional-xs
    run_command: python manage.py migrate --noinput && python manage.py createcachetable && python manage.py collectstatic --noinput
    envs:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "api.burundi4africa.com,burundi4africa.com,www.burundi4africa.com,burundi-au-api-mgo34.ondigitalocean.app"
      - key: DJANGO_SECRET_KEY
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DATABASE_URL
        type: SECRET
        value: "${db.DATABASE_URL}"
      - key: REDIS_URL
        type: SECRET
        value: "${redis.DATABASE_URL}"
      - key: DO_SPACES_KEY
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DO_SPACES_SECRET
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: DO_SPACES_BUCKET
        value: "burundi-au-media"
      - key: DO_SPACES_ENDPOINT
        value: "https://fra1.digitaloceanspaces.com"

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-1vcpu-1gb  # $15/mo managed PostgreSQL
    num_nodes: 2  # Primary + standby for HA failover (+$15/mo)
    # Read replica: create separately via doctl, then set READ_REPLICA_URL
    # in the dashboard to the replica's connection string:
    #   doctl databases replica create <db-id> read-replica --size db-s-1vcpu-1gb --region fra1
  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-1vcpu-1gb  # $15/mo managed Redis
    num_nodes: 1
