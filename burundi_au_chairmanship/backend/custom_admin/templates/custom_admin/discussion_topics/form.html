{% extends 'custom_admin/base.html' %}

{% block title %}{{ action }} Topic - Be 4 Africa Admin{% endblock %}

{% block content %}
<div class="space-y-5 max-w-2xl">

  <div>
    <h1>{{ action }} Topic</h1>
    <p>Shown as a card across the top of the Explore feed. Tapping it opens the composer.</p>
  </div>

  <form method="post" class="bg-surface-container-lowest border border-slate-200 rounded-xl p-6 space-y-4">
    {% csrf_token %}

    <div>
      <label class="block text-sm font-semibold text-on-surface mb-1">Question <span class="text-red-600">*</span></label>
      <input type="text" name="title" required maxlength="160" value="{{ item.title|default:'' }}"
             placeholder="Should A-RISE grants go directly to youth cooperatives?"
             class="w-full border border-slate-300 rounded-lg px-3 py-2">
    </div>

    <div>
      <label class="block text-sm font-semibold text-on-surface mb-1">Question (French)</label>
      <input type="text" name="title_fr" maxlength="160" value="{{ item.title_fr|default:'' }}"
             class="w-full border border-slate-300 rounded-lg px-3 py-2">
    </div>

    <div>
      <label class="block text-sm font-semibold text-on-surface mb-1">Prompt</label>
      <input type="text" name="description" maxlength="300" value="{{ item.description|default:'' }}"
             placeholder="One line telling people what to argue."
             class="w-full border border-slate-300 rounded-lg px-3 py-2">
    </div>

    <div>
      <label class="block text-sm font-semibold text-on-surface mb-1">Prompt (French)</label>
      <input type="text" name="description_fr" maxlength="300" value="{{ item.description_fr|default:'' }}"
             class="w-full border border-slate-300 rounded-lg px-3 py-2">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-on-surface mb-1">Category</label>
        <select name="category" class="w-full border border-slate-300 rounded-lg px-3 py-2">
          {% for value, label in category_choices %}
          <option value="{{ value }}" {% if item.category == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-on-surface mb-1">Order</label>
        <input type="number" name="order" value="{{ item.order|default:0 }}"
               class="w-full border border-slate-300 rounded-lg px-3 py-2">
      </div>
    </div>

    <label class="flex items-center gap-2">
      <input type="checkbox" name="is_active" {% if item.is_active or not item %}checked{% endif %}>
      <span class="text-sm text-on-surface">Show on the Explore feed</span>
    </label>

    <div class="flex gap-2 pt-2">
      <button type="submit" class="bg-primary-container inline-flex items-center gap-2">
        <span class="material-symbols-rounded">save</span>Save
      </button>
      <a href="{% url 'custom_admin:discussion_topics_list' %}" class="px-4 py-2 border border-slate-300 rounded-lg text-sm">Cancel</a>
    </div>
  </form>

</div>
{% endblock %}
