{% comment %}
Upload Progress Overlay
Include this in any form template that uploads files.

Requires:
  - The form must have id="upload-form"

Usage:
  {% include 'custom_admin/includes/upload_progress.html' %}
{% endcomment %}

<!-- Upload Progress Overlay -->
<div id="upload-overlay" class="fixed inset-0 z-50 hidden items-center justify-center" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
    <div class="bg-surface-container-lowest rounded-2xl shadow-xl p-8 w-full max-w-md mx-4 text-center">
        <span class="material-symbols-outlined text-5xl text-primary mb-4 block" id="upload-icon">cloud_upload</span>
        <h3 id="upload-status-text" class="font-headline text-xl font-bold text-on-surface mb-6">Uploading... 0%</h3>

        <!-- Progress bar -->
        <div class="w-full bg-surface-container-high rounded-full h-3 mb-4 overflow-hidden">
            <div id="upload-progress-bar" class="bg-primary h-3 rounded-full transition-all duration-200" style="width: 0%;"></div>
        </div>

        <p class="text-sm text-on-surface-variant">Please do not close this page</p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var form = document.getElementById('upload-form');
    if (!form) return;

    var overlay = document.getElementById('upload-overlay');
    var progressBar = document.getElementById('upload-progress-bar');
    var statusText = document.getElementById('upload-status-text');
    var uploadIcon = document.getElementById('upload-icon');

    // A camera photo is ~4 MB, so a batch of them is rejected by the edge
    // (413) long before it reaches Django. Resize each one to the 1920px JPEG
    // the server would have stored anyway, which is ~10x smaller.
    var MAX_DIM = 1920, JPEG_QUALITY = 0.82, SHRINK_ABOVE = 600 * 1024;

    function shrinkPhoto(file) {
        // Only JPEG: a PNG or WebP may carry transparency this would flatten.
        if (file.type !== 'image/jpeg' || file.size <= SHRINK_ABOVE) {
            return Promise.resolve(file);
        }
        return new Promise(function(resolve) {
            var url = URL.createObjectURL(file);
            var img = new Image();
            img.onload = function() {
                URL.revokeObjectURL(url);
                var scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
                var canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(function(blob) {
                    if (!blob || blob.size >= file.size) return resolve(file);
                    resolve(new File([blob], file.name, {type: 'image/jpeg'}));
                }, 'image/jpeg', JPEG_QUALITY);
            };
            img.onerror = function() { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });
    }

    function buildFormData() {
        var formData = new FormData(form);
        var inputs = Array.prototype.slice.call(form.querySelectorAll('input[type=file]'))
            .filter(function(input) { return input.name && input.files && input.files.length; });
        if (!inputs.length) return Promise.resolve(formData);

        var total = 0, done = 0;
        inputs.forEach(function(input) { total += input.files.length; });
        statusText.textContent = 'Preparing photos... 0/' + total;

        // One at a time: a whole batch at once holds every decoded photo in
        // memory and locks the tab up.
        var ready = inputs.map(function() { return []; });
        var chain = Promise.resolve();
        inputs.forEach(function(input, i) {
            Array.prototype.slice.call(input.files).forEach(function(file) {
                chain = chain.then(function() {
                    return shrinkPhoto(file).then(function(out) {
                        ready[i].push(out);
                        done += 1;
                        statusText.textContent = 'Preparing photos... ' + done + '/' + total;
                        progressBar.style.width = Math.round(done / total * 100) + '%';
                    });
                });
            });
        });

        return chain.then(function() {
            inputs.forEach(function(input) { formData.delete(input.name); });
            ready.forEach(function(files, i) {
                files.forEach(function(file) { formData.append(inputs[i].name, file); });
            });
            progressBar.style.width = '0%';
            return formData;
        });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Show overlay
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');

        var xhr = new XMLHttpRequest();

        // Track upload progress
        xhr.upload.addEventListener('progress', function(event) {
            if (event.lengthComputable) {
                var percent = Math.round((event.loaded / event.total) * 100);
                progressBar.style.width = percent + '%';
                statusText.textContent = 'Uploading... ' + percent + '%';
            }
        });

        // Handle completion
        xhr.addEventListener('load', function() {
            if (xhr.status >= 200 && xhr.status < 400) {
                progressBar.style.width = '100%';
                statusText.textContent = 'Processing...';
                uploadIcon.textContent = 'check_circle';
                uploadIcon.classList.remove('text-primary');
                uploadIcon.classList.add('text-green-500');

                // Follow redirect from server response
                var redirectUrl = xhr.responseURL;
                setTimeout(function() {
                    window.location.href = redirectUrl;
                }, 500);
            } else {
                // Server error
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                if (xhr.status === 413) {
                    alert('That upload is too large to send in one go. Add the photos in a few smaller batches.');
                } else {
                    alert('Upload failed (status ' + xhr.status + '). Please try again.');
                }
            }
        });

        // Handle network error
        xhr.addEventListener('error', function() {
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            alert('Upload failed due to a network error. Please try again.');
        });

        buildFormData().then(function(formData) {
            statusText.textContent = 'Uploading... 0%';
            xhr.open(form.method, form.action || window.location.href);
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.send(formData);
        });
    });
});
</script>
