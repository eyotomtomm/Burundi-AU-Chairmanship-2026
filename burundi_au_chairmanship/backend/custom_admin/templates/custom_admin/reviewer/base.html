<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ t.portal_title }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { vertical-align: middle; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 text-lg min-h-screen">
    <!-- Fixed Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-green-700" style="font-size:32px">how_to_reg</span>
                <h1 class="text-xl font-bold text-green-800">{{ t.portal_title }}</h1>
            </div>
            <div class="flex items-center gap-3">
                <!-- FR/EN Toggle -->
                <form method="post" action="{% url 'custom_admin:reviewer_set_lang' %}" class="flex gap-1">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.get_full_path }}">
                    <button type="submit" name="lang" value="fr"
                            class="px-3 py-1.5 rounded-lg text-sm font-semibold transition
                                   {% if lang == 'fr' %}bg-green-700 text-white{% else %}bg-gray-100 text-gray-600 hover:bg-gray-200{% endif %}">
                        FR
                    </button>
                    <button type="submit" name="lang" value="en"
                            class="px-3 py-1.5 rounded-lg text-sm font-semibold transition
                                   {% if lang == 'en' %}bg-green-700 text-white{% else %}bg-gray-100 text-gray-600 hover:bg-gray-200{% endif %}">
                        EN
                    </button>
                </form>
                <!-- Logout -->
                <a href="{% url 'custom_admin:logout' %}"
                   class="flex items-center gap-1 px-3 py-1.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition">
                    <span class="material-symbols-outlined" style="font-size:20px">logout</span>
                    {{ t.logout }}
                </a>
            </div>
        </div>
    </header>

    <!-- Flash Messages -->
    {% if messages %}
    <div class="max-w-5xl mx-auto px-4 mt-4">
        {% for message in messages %}
        <div class="mb-2 px-4 py-3 rounded-lg text-base font-medium
                    {% if message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200
                    {% elif message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200
                    {% elif message.tags == 'warning' %}bg-yellow-50 text-yellow-800 border border-yellow-200
                    {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
